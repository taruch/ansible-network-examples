---
# Network Targeting Demo - AAP Setup
#
# Creates a demo inventory with fake network devices, groups for each
# targeting dimension, and a job template with a 5-dropdown survey.
#
# Usage:
#   ansible-navigator run -mstdout demo_setup.yml -vvv \
#     --eei=quay.io/truch/ee25:1.3 \
#     --penv=CONTROLLER_USERNAME --penv=CONTROLLER_PASSWORD \
#     --penv=CONTROLLER_HOST --penv=CONTROLLER_VERIFY_SSL
#
# Prerequisites:
#   - CONTROLLER_HOST, CONTROLLER_USERNAME, CONTROLLER_PASSWORD env vars set
#   - "Ansible Network Examples" project synced in AAP
#   - "Demo Credential" exists (or change demo_credential below)
#
# After running:
#   1. Open AAP → Templates → "TARGETING / Network Multi-Attribute Demo"
#   2. Launch → select from the 5 survey dropdowns
#   3. The playbook shows which devices matched the filter intersection

- name: Create Network Targeting Demo in AAP
  hosts: localhost
  connection: local
  gather_facts: false
  module_defaults:
    group/ansible.controller.controller:
      controller_host: "https://{{ aap_hostname }}"
      controller_oauthtoken: "{{ controller_oauthtoken | default(omit) }}"
      validate_certs: "{{ aap_validate_certs }}"
      request_timeout: 60

  vars:
    aap_username: "{{ lookup('env', 'CONTROLLER_USERNAME') }}"
    aap_password: "{{ lookup('env', 'CONTROLLER_PASSWORD') }}"
    aap_hostname: "{{ lookup('env', 'CONTROLLER_HOST') }}"
    aap_validate_certs: "{{ lookup('env', 'CONTROLLER_VERIFY_SSL') | default('false') }}"

    demo_inventory: "Network Targeting Demo"
    demo_organization: "Default"
    demo_project: "Ansible Network Examples"
    demo_credential: "Demo Credential"

    # ------------------------------------------------------------------
    # 24 fake devices: Alcatel + Extreme, 2 sites x 3 buildings
    # ------------------------------------------------------------------
    demo_hosts:
      # --- Campus East - Building A ---
      - { name: ce-a-mdr-01,  device_vendor: alcatel,  device_model: os6900_x20,   device_function: mdr,          device_site: campus_east,       device_building: building_a }
      - { name: ce-a-mds-01,  device_vendor: alcatel,  device_model: os6860_p48,   device_function: mds,          device_site: campus_east,       device_building: building_a }
      - { name: ce-a-mas-01,  device_vendor: alcatel,  device_model: os6860e_p48,  device_function: mas,          device_site: campus_east,       device_building: building_a }
      - { name: ce-a-edge-01, device_vendor: alcatel,  device_model: os6860e_p48,  device_function: edge_switch,  device_site: campus_east,       device_building: building_a }
      - { name: ce-a-edge-02, device_vendor: alcatel,  device_model: os6850_p24,   device_function: edge_switch,  device_site: campus_east,       device_building: building_a }
      # --- Campus East - Building B ---
      - { name: ce-b-mdr-01,  device_vendor: alcatel,  device_model: os6900_x20,   device_function: mdr,          device_site: campus_east,       device_building: building_b }
      - { name: ce-b-mds-01,  device_vendor: alcatel,  device_model: os6860_p48,   device_function: mds,          device_site: campus_east,       device_building: building_b }
      - { name: ce-b-mas-01,  device_vendor: alcatel,  device_model: os6860e_p48,  device_function: mas,          device_site: campus_east,       device_building: building_b }
      - { name: ce-b-edge-01, device_vendor: alcatel,  device_model: os6860e_p48,  device_function: edge_switch,  device_site: campus_east,       device_building: building_b }
      - { name: ce-b-edge-02, device_vendor: extreme,  device_model: x460_g2,      device_function: edge_switch,  device_site: campus_east,       device_building: building_b }
      # --- Campus East - Building C ---
      - { name: ce-c-mds-01,  device_vendor: alcatel,  device_model: os6860_p48,   device_function: mds,          device_site: campus_east,       device_building: building_c }
      - { name: ce-c-edge-01, device_vendor: alcatel,  device_model: os6850_p24,   device_function: edge_switch,  device_site: campus_east,       device_building: building_c }
      - { name: ce-c-edge-02, device_vendor: extreme,  device_model: x460_g2,      device_function: edge_switch,  device_site: campus_east,       device_building: building_c }
      # --- Campus West - Building A ---
      - { name: cw-a-mdr-01,  device_vendor: alcatel,  device_model: os6900_x20,   device_function: mdr,          device_site: campus_west,  device_building: building_a }
      - { name: cw-a-mds-01,  device_vendor: alcatel,  device_model: os6860_p48,   device_function: mds,          device_site: campus_west,  device_building: building_a }
      - { name: cw-a-mas-01,  device_vendor: alcatel,  device_model: os6860e_p48,  device_function: mas,          device_site: campus_west,  device_building: building_a }
      - { name: cw-a-edge-01, device_vendor: alcatel,  device_model: os6860e_p48,  device_function: edge_switch,  device_site: campus_west,  device_building: building_a }
      - { name: cw-a-edge-02, device_vendor: extreme,  device_model: x460_g2,      device_function: edge_switch,  device_site: campus_west,  device_building: building_a }
      # --- Campus West - Building B ---
      - { name: cw-b-mds-01,  device_vendor: alcatel,  device_model: os6860_p48,   device_function: mds,          device_site: campus_west,  device_building: building_b }
      - { name: cw-b-edge-01, device_vendor: alcatel,  device_model: os6850_p24,   device_function: edge_switch,  device_site: campus_west,  device_building: building_b }
      - { name: cw-b-edge-02, device_vendor: extreme,  device_model: x460_g2,      device_function: edge_switch,  device_site: campus_west,  device_building: building_b }
      # --- Campus West - Building C ---
      - { name: cw-c-mds-01,  device_vendor: alcatel,  device_model: os6860_p48,   device_function: mds,          device_site: campus_west,  device_building: building_c }
      - { name: cw-c-edge-01, device_vendor: alcatel,  device_model: os6860e_p48,  device_function: edge_switch,  device_site: campus_west,  device_building: building_c }
      - { name: cw-c-edge-02, device_vendor: extreme,  device_model: x460_g2,      device_function: edge_switch,  device_site: campus_west,  device_building: building_c }

    # ------------------------------------------------------------------
    # Groups — each maps one attribute value to a group name
    # ------------------------------------------------------------------
    demo_groups:
      # Vendor
      - { name: vendor_alcatel,      attr: device_vendor,   value: alcatel }
      - { name: vendor_extreme,      attr: device_vendor,   value: extreme }
      # Model
      - { name: model_os6900_x20,    attr: device_model,    value: os6900_x20 }
      - { name: model_os6860_p48,    attr: device_model,    value: os6860_p48 }
      - { name: model_os6860e_p48,   attr: device_model,    value: os6860e_p48 }
      - { name: model_os6850_p24,    attr: device_model,    value: os6850_p24 }
      - { name: model_x460_g2,       attr: device_model,    value: x460_g2 }
      # Function
      - { name: role_mdr,            attr: device_function, value: mdr }
      - { name: role_mds,            attr: device_function, value: mds }
      - { name: role_mas,            attr: device_function, value: mas }
      - { name: role_edge_switch,    attr: device_function, value: edge_switch }
      # Site
      - { name: site_campus_east,      attr: device_site,     value: campus_east }
      - { name: site_campus_west, attr: device_site,     value: campus_west }
      # Building
      - { name: building_a,          attr: device_building, value: building_a }
      - { name: building_b,          attr: device_building, value: building_b }
      - { name: building_c,          attr: device_building, value: building_c }

  tasks:
    # ------------------------------------------------------------------
    # Authenticate to AAP gateway
    # ------------------------------------------------------------------
    - name: Get authentication token from AAP gateway
      ansible.builtin.uri:
        url: "https://{{ aap_hostname }}/api/gateway/v1/tokens/"
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        method: POST
        force_basic_auth: true
        validate_certs: "{{ aap_validate_certs }}"
        status_code: 201
      register: authtoken_res
      no_log: true

    - name: Set OAuth token for subsequent tasks
      ansible.builtin.set_fact:
        controller_oauthtoken: "{{ authtoken_res.json.token }}"
        controller_oauthtoken_url: "{{ authtoken_res.json.url }}"

    # ------------------------------------------------------------------
    # Inventory
    # ------------------------------------------------------------------
    - name: Create demo inventory
      ansible.controller.inventory:
        name: "{{ demo_inventory }}"
        organization: "{{ demo_organization }}"
        description: "Fake network devices for multi-attribute targeting demo"
        state: present

    # ------------------------------------------------------------------
    # Hosts
    # ------------------------------------------------------------------
    - name: Create demo hosts
      ansible.controller.host:
        name: "{{ item.name }}"
        inventory: "{{ demo_inventory }}"
        state: present
        enabled: true
        variables:
          device_vendor: "{{ item.device_vendor }}"
          device_model: "{{ item.device_model }}"
          device_function: "{{ item.device_function }}"
          device_site: "{{ item.device_site }}"
          device_building: "{{ item.device_building }}"
      loop: "{{ demo_hosts }}"
      loop_control:
        label: "{{ item.name }}"

    # ------------------------------------------------------------------
    # Groups — selectattr picks hosts matching each group's attribute
    # ------------------------------------------------------------------
    - name: Create groups and assign hosts
      ansible.controller.group:
        name: "{{ item.name }}"
        inventory: "{{ demo_inventory }}"
        state: present
        hosts: >-
          {{ demo_hosts
             | selectattr(item.attr, 'equalto', item.value)
             | map(attribute='name')
             | list }}
      loop: "{{ demo_groups }}"
      loop_control:
        label: "{{ item.name }} ({{ item.value }})"

    # ------------------------------------------------------------------
    # Job Template with 5-dropdown survey
    # ------------------------------------------------------------------
    - name: Create targeting job template
      ansible.controller.job_template:
        name: "TARGETING / Network Multi-Attribute Demo"
        description: >-
          Target network devices by vendor, model, role, site, and building.
          Survey dropdowns build a host intersection pattern at runtime via Jinja2.
        organization: "{{ demo_organization }}"
        project: "{{ demo_project }}"
        inventory: "{{ demo_inventory }}"
        playbook: alcatel_examples/network_targeting_demo.yml
        credentials:
          - "{{ demo_credential }}"
        job_type: run
        verbosity: 0
        ask_limit_on_launch: true
        survey_enabled: true
        survey_spec:
          name: ""
          description: ""
          spec:
            - variable: target_vendor
              question_name: !unsafe "Target Vendor"
              question_description: !unsafe "Filter by device vendor. Select 'all' to include all vendors."
              type: multiplechoice
              required: true
              default: "all"
              choices: "all\nalcatel\nextreme"
              min: 0
              max: 64
              new_question: true
            - variable: target_model
              question_name: !unsafe "Target Model"
              question_description: !unsafe "Filter by device model. Select 'all' to include all models."
              type: multiplechoice
              required: true
              default: "all"
              choices: "all\nos6900_x20\nos6860_p48\nos6860e_p48\nos6850_p24\nx460_g2"
              min: 0
              max: 64
              new_question: false
            - variable: target_role
              question_name: !unsafe "Target Role"
              question_description: !unsafe "Filter by device function. Select 'all' to include all roles."
              type: multiplechoice
              required: true
              default: "all"
              choices: "all\nmdr\nmds\nmas\nedge_switch"
              min: 0
              max: 64
              new_question: false
            - variable: target_site
              question_name: !unsafe "Target Site"
              question_description: !unsafe "Filter by physical site. Select 'all' to include all sites."
              type: multiplechoice
              required: true
              default: "all"
              choices: "all\ncampus_east\ncampus_west"
              min: 0
              max: 64
              new_question: false
            - variable: target_building
              question_name: !unsafe "Target Building"
              question_description: !unsafe "Filter by building. Select 'all' to include all buildings."
              type: multiplechoice
              required: true
              default: "all"
              choices: "all\na\nb\nc"
              min: 0
              max: 64
              new_question: false

    - name: Done
      ansible.builtin.debug:
        msg:
          - "Demo setup complete."
          - "Inventory: {{ demo_inventory }} ({{ demo_hosts | length }} hosts, {{ demo_groups | length }} groups)"
          - "Template:  TARGETING / Network Multi-Attribute Demo"
          - ""
          - "Demo scenarios to show:"
          - "  1. All defaults (all) → 24 devices"
          - "  2. vendor=alcatel → 19 Alcatel devices"
          - "  3. vendor=alcatel, role=edge_switch → 9 Alcatel edge switches"
          - "  4. vendor=alcatel, role=edge_switch, site=campus_east → 5 Alcatel edge at Campus East"
          - "  5. vendor=alcatel, model=os6860e_p48, site=campus_east, building=building_a → 2 devices"
          - "  6. vendor=extreme → 5 Extreme devices across all sites"
...
